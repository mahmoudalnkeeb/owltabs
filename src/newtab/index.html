<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OwlTabs</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600&family=Geist+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <!-- Header: clock, search, actions -->
    <header class="topbar" id="nt-topbar">
      <div class="topbar-clock" id="nt-clock"></div>
      <div class="omnibox" id="nt-omnibox" role="search"></div>
      <div class="topbar-controls" id="nt-controls"></div>
    </header>

    <main class="nt-main">
      <nav class="ql-grid" aria-label="Quick links" id="nt-quicklinks"></nav>

      <div class="reader">
        <aside class="feed-sidebar" id="nt-feed-sidebar" aria-label="Feed filters"></aside>
        <section class="feed-pane" aria-labelledby="nt-feed-head">
          <div class="list-head" id="nt-feed-head"></div>
          <div class="feed-list" id="nt-feed-list" role="list"></div>
        </section>
      </div>
    </main>

    <!-- AI assistant side panel -->
    <aside class="ai-chat" id="nt-ai-chat" aria-label="AI assistant" hidden></aside>

    <!-- Settings Drawer -->
    <aside
      class="settings-drawer"
      id="nt-settings"
      aria-label="Settings"
      hidden
    ></aside>

    <!-- Backdrop -->
    <div class="nt-backdrop" id="nt-backdrop" hidden></div>

    <!-- Toast Region -->
    <div class="toast-region" id="toast-region" aria-live="polite"></div>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
